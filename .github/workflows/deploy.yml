name: Publish Docs
on:
  push:
    branches:
      - main  # Trigger every time you push to the main branch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material mkdocs-swagger-ui-tag  # Add any other plugins here
      - run: mkdocs gh-deploy --force