site_name: Documentation Portal | Sheethal U
site_url: https://sheethalu.github.io/Documentation-Portal/
theme:
  name: material
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

plugins:
  - search
  - swagger-ui-tag:
      path_type: relative

nav:
  - Welcome: index.md
  - Project Overview: project-intro.md
  - API Reference:
    - Authentication: docs/auth/login.md
    - Search: docs/search/search-loans.md
    - Sorting: docs/sorting/sorting.md
    - Dropdowns: docs/dropdown/dropdowns.md
    - Error Codes: docs/errors/errors.md
  - Resources & Downloads: resources.md
  - OpenAPI Spec: swagger.yaml

markdown_extensions:
  - attr_list

